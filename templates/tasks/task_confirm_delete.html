{% extends 'base.html' %}

{% block title %}Delete {{ task.title }}{% endblock %}

{% block content %}
  <h1>Delete task</h1>
  <p>
    Delete <strong>{{ task.title }}</strong>? Its comments will be deleted too.
    This cannot be undone.
  </p>

  <form method="post">
    {% csrf_token %}
    <button type="submit">Delete</button>
    <a href="{{ task.get_absolute_url }}">Cancel</a>
  </form>
{% endblock %}
