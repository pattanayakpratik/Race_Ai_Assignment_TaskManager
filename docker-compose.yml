# Local MySQL for the Task Manager project.
#
#   docker compose up -d          start MySQL in the background
#   docker compose ps             check that the healthcheck passes
#   docker compose down           stop it (data survives in the named volume)
#   docker compose down -v        stop it and wipe the data
#
# Django 6.1 requires MySQL 8.4+, so this pins the 8.4 LTS release.

services:
  db:
    image: mysql:8.4
    container_name: taskmanager-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-taskmanager}
      MYSQL_USER: ${DB_USER:-taskmanager}
      MYSQL_PASSWORD: ${DB_PASSWORD:-taskmanager}
    ports:
      # Host 3307 avoids clashing with a MySQL already installed on the host.
      - "${DB_PORT:-3307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
      # Runs once, on first initialisation of an empty data directory. Grants
      # the app user rights over test_* databases so `manage.py test` can
      # create its throwaway database.
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Waits until the server actually accepts connections, so
      # `docker compose up -d --wait` is enough before running migrate.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql_data:
